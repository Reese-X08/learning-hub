            priorityRow.append(button);
            return button;
          });

          const noteInput = el('textarea', { maxlength: '2000', placeholder: '可选：作业要求、要带的东西…' });
          noteInput.value = draft.note || '';

          const doneInput = el('input', { type: 'checkbox', checked: Boolean(draft.done) });

          const fileList = el('div', { class: 'file-list' });
          const fileInput = el('input', { type: 'file', multiple: true, hidden: true });
          const dropZone = el(
            'div',
            { class: 'drop-zone', role: 'button', tabindex: '0', title: '点击选择文件' },
            el('div', { class: 'drop-icon' }, '📎'),
            el(
              'div',
              { class: 'drop-text' },
              '点击选择，或把文件拖到这里',
              el('br'),
              el('span', { class: 'muted tiny' }, `单个不超过 50MB，一条事务最多 ${MAX_FILES_PER_TASK} 个`),
            ),
          );

          function addFiles(fileListValue) {
            for (const file of Array.from(fileListValue || [])) {
              if (file.size > MAX_FILE_BYTES) {
                toast(`「${file.name}」超过 50MB`, 'error');
                continue;
              }
              if (files.length - removed.length + pending.length >= MAX_FILES_PER_TASK) {
                toast(`一条事务最多 ${MAX_FILES_PER_TASK} 个附件`, 'error');
                break;
              }
              pending.push(file);
            }
            renderFiles();
          }

          function renderFiles() {
            const rows = [];
            for (const file of files) {
              if (removed.some((item) => item.id === file.id)) continue;
              const row = el(
                'div',
                { class: 'file-row' },
                el('span', { class: 'file-icon' }, iconFor(file.name)),
                el('span', { class: 'file-name', title: file.name }, file.name),
                el('span', { class: 'file-size' }, formatSize(file.size)),
              );
              const download = el('button', {
                type: 'button',
                class: 'icon-btn small',
                title: '下载',
                'aria-label': '下载附件',
              }, '↓');
              download.addEventListener('click', () => downloadFile(file));
              const remove = el('button', {
                type: 'button',
                class: 'icon-btn small danger',
                title: '移除（保存后生效）',
                'aria-label': '移除附件',
              }, '×');
              remove.addEventListener('click', () => {
                removed.push(file);
                renderFiles();
              });
              row.append(download, remove);
              rows.push(row);
            }

            pending.forEach((file, index) => {
              const row = el(
                'div',
                { class: 'file-row pending' },
                el('span', { class: 'file-icon' }, iconFor(file.name)),
                el('span', { class: 'file-name', title: file.name }, file.name),
                el('span', { class: 'file-size' }, formatSize(file.size)),
                el('span', { class: 'file-note' }, '保存后写入'),
              );
              const remove = el('button', {
                type: 'button',
                class: 'icon-btn small danger',
                title: '移除',
                'aria-label': '移除附件',
              }, '×');
              remove.addEventListener('click', () => {
                pending.splice(index, 1);
                renderFiles();
              });
              row.append(remove);
              rows.push(row);
            });

            fileList.replaceChildren(...rows);
          }

          dropZone.addEventListener('click', () => fileInput.click());
          dropZone.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              fileInput.click();
            }
          });
          dropZone.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropZone.classList.add('over');
          });
          dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
          dropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            dropZone.classList.remove('over');
            addFiles(event.dataTransfer?.files);
          });
          fileInput.addEventListener('change', () => {
            addFiles(fileInput.files);
            fileInput.value = '';
          });

          renderFiles();

          const saveButton = el('button', { type: 'submit', class: 'btn primary' }, task ? '保存' : '创建事务');
          const form = openModal({
            title: task ? '编辑事务' : '新建事务',
            body: [
              el('label', { class: 'field' }, el('span', {}, '标题 *'), titleInput),
              el(
                'div',
                { class: 'row-2' },
                el('label', { class: 'field' }, el('span', {}, '日期 *'), dateInput),
                el('label', { class: 'field' }, el('span', {}, '分类'), categorySelect),
              ),
              el('div', { class: 'field' }, el('span', {}, '优先级'), priorityRow),
              el('label', { class: 'field' }, el('span', {}, '备注'), noteInput),
              el(
                'div',
                { class: 'field' },
                el('span', {}, '相关文件'),
                dropZone,
                fileInput,
                fileList,
              ),
              el(
                'label',
                { class: 'checkbox-row' },
                doneInput,
                '已完成',
              ),
            ],
            footer: [
              el('button', { type: 'button', class: 'btn ghost', onclick: () => closeModal() }, '取消'),
              saveButton,
            ],
          });

          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const modal = form;
            const title = titleInput.value.trim();
            if (!title) {
              showModalError(modal, '标题不能为空');
              titleInput.focus();
              return;
            }
            const date = dateInput.value;
            if (!normalizeDate(date)) {
              showModalError(modal, '请选择一个有效日期');
              dateInput.focus();
              return;
            }

            saveButton.disabled = true;
            saveButton.textContent = '保存中…';

            try {
              const id = task ? task.id : uid();
              const finalFiles = files.filter((file) => !removed.some((item) => item.id === file.id));

              for (const file of pending) {
                const fileId = uid();
                await storage.putFile(fileId, file, { name: file.name, type: file.type });
                finalFiles.push({
                  id: fileId,
                  name: file.name.slice(0, 200),
                  size: file.size,
                  type: file.type || '',
                });
              }

              const payload = {
                title,
                date,
                categoryId: categorySelect.value,
                note: noteInput.value.trim(),
                priority,
                done: doneInput.checked,
                files: finalFiles,
                updatedAt: nowIso(),
              };

              if (task) Object.assign(task, payload);
              else {
                state.tasks.push({
                  id,
                  ...payload,
                  createdAt: nowIso(),
                });
              }

              await persist();

              // 数据已经写成功，再清理被移除的附件，避免保存失败时把旧附件删掉
              for (const file of removed) {
                try {
                  await storage.deleteFile(file.id);
                } catch {
                  /* 留着也无害 */
                }
              }

              const [year, month] = date.split('-').map(Number);
              state.month = new Date(year, month - 1, 1);
              closeModal();
              render();
              toast(task ? '已保存' : '事务已创建');
            } catch (error) {
              console.error(error);
              showModalError(modal, error.message || '保存失败');
              saveButton.disabled = false;
              saveButton.textContent = task ? '保存' : '创建事务';
            }
          });
        }

        /* ── 某一天 / 分类编辑 ───────────────────────────── */

        function openDay(dateStr) {
          const tasks = filteredTasks().filter((task) => task.date === dateStr);
          const body = [];

          if (tasks.length) {
            const list = el('div', { class: 'day-list' });
            for (const task of tasks) {
              const item = el('button', { type: 'button', class: 'day-item' });
              item.append(
                el('span', { class: 'day-mark' }, task.done ? '✓' : '○'),
                el(
                  'div',
                  { class: 'day-main' },
                  el('div', { class: 'day-title' }, task.title),
                  el(
                    'div',
                    { class: 'muted tiny' },
                    `${categoryName(task.categoryId)} · 优先级${PRIORITY_LABELS[(task.priority || 2) - 1]}${task.note ? ` · ${task.note.slice(0, 40)}` : ''}`,
                  ),
                ),
              );
              item.addEventListener('click', () => {
                closeModal();
                openTaskEditor(task.id);
              });
              list.append(item);
            }
            body.push(list);
          } else {
            body.push(el('p', { class: 'muted' }, '这一天还没有事务。'));
          }

          const form = openModal({
            title: `${formatDay(dateStr)} · ${tasks.length} 条`,
            body,
            footer: [
              el('button', { type: 'button', class: 'btn ghost', onclick: () => closeModal() }, '关闭'),
              el('button', { type: 'button', class: 'btn primary', onclick: () => {
                closeModal();
                openTaskEditor(null, dateStr);
              } }, '＋ 在这天新建'),
            ],
          });
          form.addEventListener('submit', (event) => event.preventDefault());
        }

        function openCategoryEditor(category) {
          const isNew = !category;
          const nameInput = el('input', {
            type: 'text',
            maxlength: '30',
            value: category?.name || '',
            placeholder: '例如：考试、社团',
          });

          let color = category?.color || PALETTE[state.categories.length % PALETTE.length];
          const swatches = el('div', { class: 'swatches', role: 'group', 'aria-label': '分类颜色' });
          for (const value of PALETTE) {
            const swatch = el('button', {
              type: 'button',
              class: `swatch${value === color ? ' selected' : ''}`,
              'aria-label': `颜色 ${value}`,
              'aria-pressed': String(value === color),
            });
            swatch.style.background = value;
            swatch.addEventListener('click', () => {
              color = value;
              for (const node of $$('.swatch', swatches)) {
                node.classList.toggle('selected', node === swatch);
                node.setAttribute('aria-pressed', String(node === swatch));
              }
            });
            swatches.append(swatch);
          }

          const saveButton = el('button', { type: 'submit', class: 'btn primary' }, isNew ? '新建分类' : '保存');
          const footer = [];
          if (!isNew) {
            const deleteButton = el('button', {
              type: 'button',
              class: 'btn danger push-left',
              onclick: async () => {
                const count = state.tasks.filter((task) => task.categoryId === category.id).length;
                const ok = await confirmDialog({
                  title: '删除分类',
                  message: count
                    ? `删除「${category.name}」后，其中 ${count} 条事务会变成「未分类」，事务本身不会删除。`
                    : `确定删除分类「${category.name}」吗？`,
                });
                if (!ok) return;
                state.categories = state.categories.filter((item) => item.id !== category.id);
                for (const task of state.tasks) {
                  if (task.categoryId === category.id) task.categoryId = '';
                }
                if (state.category === category.id) state.category = 'all';
                await persist();
                render();
                toast('分类已删除');
              },
            }, '删除分类');
            footer.push(deleteButton);
          }
          footer.push(
            el('button', { type: 'button', class: 'btn ghost', onclick: () => closeModal() }, '取消'),
            saveButton,
          );

          const form = openModal({
            title: isNew ? '新建分类' : '编辑分类',
            body: [
              el('label', { class: 'field' }, el('span', {}, '分类名 *'), nameInput),
              el('div', { class: 'field' }, el('span', {}, '颜色'), swatches),
            ],
            footer,
          });

          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const name = nameInput.value.trim();
            if (!name) {
              showModalError(form, '分类名不能为空');
              nameInput.focus();
              return;
            }
            if (state.categories.some((item) => item.name === name && item.id !== category?.id)) {
              showModalError(form, '已经有同名分类了');
              return;
            }

            saveButton.disabled = true;
            try {
              if (category) Object.assign(category, { name, color });
              else state.categories.push({ id: uid(), name, color });
              await persist();
              closeModal();
              render();
              toast(isNew ? '分类已创建' : '分类已保存');
            } catch (error) {
              showModalError(form, error.message || '保存失败');
              saveButton.disabled = false;
            }
          });
        }

        /* ── 增删改 / 收藏 ────────────────────────────────── */

        let saveChain = Promise.resolve();

        function persist() {
          const payload = {
            version: 2,
            categories: state.categories,
            tasks: state.tasks,
          };
          saveChain = saveChain.then(
            () => storage.save(payload),
            () => storage.save(payload),
          );
          return saveChain;
        }

        function setCategory(id) {
          state.category = id;
          render();
        }

        function setView(view) {
          state.view = view;
          render();
        }

        function changeMonth(delta) {
          state.month = new Date(state.month.getFullYear(), state.month.getMonth() + delta, 1);
          render();
        }

        function goToday() {
          state.month = new Date();
          render();
        }

        async function toggleDone(id, done) {
          const task = state.tasks.find((item) => item.id === id);
          if (!task) return;
          const previous = task.done;
          task.done = done;
          task.updatedAt = nowIso();
          render();
          try {
            await persist();
          } catch (error) {
            task.done = previous;
            render();
            toast(error.message || '保存失败', 'error');
          }
        }

        async function deleteTask(id) {
          const task = state.tasks.find((item) => item.id === id);
          if (!task) return;
          const ok = await confirmDialog({
            title: '删除事务',
            message: `确定删除「${task.title}」吗？${task.files && task.files.length ? `它的 ${task.files.length} 个附件也会一起删掉，` : ''}删除后无法恢复。`,
          });
          if (!ok) return;

          try {
            state.tasks = state.tasks.filter((item) => item.id !== id);
            await persist();
            // 状态写成功后再删附件；即使删除失败，也只是留下一个孤儿文件
            for (const file of task.files || []) {
              try {
                await storage.deleteFile(file.id);
              } catch {
                /* 留着也无害 */
              }
            }
            render();
            toast('事务已删除');
          } catch (error) {
            toast(error.message || '删除失败', 'error');
          }
        }

        async function downloadFile(file) {
          try {
            const blob = await storage.getFile(file.id);
            if (!blob) throw new Error('附件内容已经不在了');
            downloadBlob(blob, file.name);
          } catch (error) {
            toast(`下载失败：${error.message || error}`, 'error');
          }
        }

        /* ── 导入 / 导出 ──────────────────────────────────── */

        async function exportBackup() {
          const buttons = $$('.js-export');
          buttons.forEach((button) => (button.disabled = true));
          toast('正在打包备份…');
          try {
            const data = {
              version: 2,
              app: '事务中心',
              exportedAt: nowIso(),
              categories: state.categories,
              tasks: JSON.parse(JSON.stringify(state.tasks)),
            };
            for (const task of data.tasks) {
              for (const file of task.files || []) {
                try {
                  const blob = await storage.getFile(file.id);
                  if (blob) file.data = await blobToDataUrl(blob);
                } catch {
                  /* 文件丢失就只导出元信息 */
                }
              }
            }
            downloadBlob(
              new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }),
              `事务中心-备份-${todayKey()}.json`,
            );
            toast('备份已导出');
          } catch (error) {
            toast(`导出失败：${error.message || error}`, 'error');
          } finally {
            buttons.forEach((button) => (button.disabled = false));
          }
        }

        async function handleImportFile(file) {
          let payload;
          try {
            payload = JSON.parse(await file.text());
          } catch {
            toast('这个文件不是合法的 JSON', 'error');
            return;
          }
          if (!payload || typeof payload !== 'object' || !Array.isArray(payload.tasks)) {
            toast('文件里没有 tasks 列表，不像是事务备份', 'error');
            return;
          }

          const taskCount = payload.tasks.length;
          const categoryCount = Array.isArray(payload.categories) ? payload.categories.length : 0;
          const fileCount = payload.tasks.reduce(
            (sum, task) => sum + (Array.isArray(task?.files) ? task.files.length : 0),
            0,
          );
          const legacy = Boolean(payload._说明) || payload.tasks.some((task) => task && task.cat !== undefined);

          const mergeButton = el('button', { type: 'button', class: 'btn primary' }, '合并导入');
          const replaceButton = el('button', { type: 'button', class: 'btn danger' }, '替换全部');
          const form = openModal({
            title: '导入备份',
            body: [
              el(
                'p',
                {},
                `文件里有 ${taskCount} 条事务、${categoryCount} 个分类、${fileCount} 个附件${
                  legacy ? '，看起来是旧版「我的事务管理」的数据' : ''
                }。`,
              ),
              el(
                'p',
                { class: 'muted tiny' },
                '合并导入：保留现有内容，按「标题 + 日期」跳过重复；替换全部：用文件里的内容覆盖当前数据。',
              ),
            ],
            footer: [
              el('button', { type: 'button', class: 'btn ghost', onclick: () => closeModal() }, '取消'),
              mergeButton,
              replaceButton,
            ],
          });

          const run = async (mode, button) => {
            button.disabled = true;
            const label = button.textContent;
            button.textContent = '导入中…';
            try {
              const result = await importPayload(payload, mode);
              closeModal();
              render();
              toast(
                `已导入 ${result.added} 条事务${result.filesAdded ? `、${result.filesAdded} 个附件` : ''}${
                  result.skipped ? `，跳过 ${result.skipped} 条重复` : ''
                }`,
              );
            } catch (error) {
              console.error(error);
              button.disabled = false;
              button.textContent = label;
              showModalError(form, error.message || '导入失败');
            }
          };

          mergeButton.addEventListener('click', () => run('merge', mergeButton));
          replaceButton.addEventListener('click', () => run('replace', replaceButton));
          form.addEventListener('submit', (event) => event.preventDefault());
        }

        async function importPayload(payload, mode) {
          const incomingCategories = Array.isArray(payload.categories) ? payload.categories : [];
          const incomingTasks = Array.isArray(payload.tasks) ? payload.tasks : [];
          if (!incomingTasks.length && !incomingCategories.length) {
            throw new Error('文件里没有可导入的事务');
          }

          const nextCategories = mode === 'replace' ? [] : state.categories.map((category) => ({ ...category }));
          const categoryMap = new Map();

          for (const item of incomingCategories) {
            const name = cleanText(item?.name, 30);
            if (!name) continue;
            let target =
              nextCategories.find((category) => category.id === item?.id) ||
              nextCategories.find((category) => category.name === name);
            if (!target) {
              target = {
                id:
                  mode === 'replace' && isId(item?.id) && !nextCategories.some((category) => category.id === item.id)
                    ? item.id
                    : uid(),
                name,
                color: isColor(item?.color) ? item.color : PALETTE[nextCategories.length % PALETTE.length],
              };
              nextCategories.push(target);
            }
            if (item?.id !== undefined) categoryMap.set(String(item.id), target.id);
            categoryMap.set(name, target.id);
          }

          const nextTasks = mode === 'replace' ? [] : state.tasks.map((task) => ({ ...task }));
          const seen = new Set(nextTasks.map((task) => `${task.title}|${task.date}`));
          const usedIds = new Set(nextTasks.map((task) => task.id));
          let added = 0;
          let skipped = 0;
          let filesAdded = 0;

          for (const item of incomingTasks) {
            const title = cleanText(item?.title, 120);
            const date = normalizeDate(item?.date);
            if (!title || !date) continue;

            const key = `${title}|${date}`;
            if (mode === 'merge' && seen.has(key)) {
              skipped += 1;
              continue;
            }
            seen.add(key);

            let id = mode === 'replace' && isId(item?.id) && !usedIds.has(item.id) ? item.id : uid();
            while (usedIds.has(id)) id = uid();
            usedIds.add(id);

            const rawCategory = item?.categoryId ?? item?.cat;
            let categoryId = categoryMap.get(String(rawCategory ?? '')) || '';
            if (!categoryId && nextCategories.some((category) => category.id === rawCategory)) {
              categoryId = rawCategory;
            }

            const files = [];
            for (const file of Array.isArray(item?.files) ? item.files.slice(0, MAX_FILES_PER_TASK) : []) {
              const name = cleanText(file?.name, 200);
              if (!name) continue;

              let blob = null;
              if (typeof file?.data === 'string' && file.data.startsWith('data:')) {
                try {
                  blob = await (await fetch(file.data)).blob();
                } catch {
                  blob = null;
                }
              }

              if (blob) {
                const fileId = uid();
                await storage.putFile(fileId, blob, { name, type: file.type || blob.type });
                files.push({
                  id: fileId,
                  name,
                  size: blob.size,
                  type: cleanText(file?.type || blob.type, 120),
                });
                filesAdded += 1;
              } else {
                files.push({
                  id: isId(file?.id) ? file.id : uid(),
                  name,
                  size: clampInt(file?.size, 0, MAX_FILE_BYTES * 4, 0),
                  type: cleanText(file?.type, 120),
                });
              }
            }

            nextTasks.push({
              id,
              title,
              date,
              categoryId,
              note: cleanText(item?.note, 2000),
              priority: clampInt(item?.priority, 1, 3, 2),
              done: Boolean(item?.done),
              files,
              createdAt: typeof item?.createdAt === 'string' ? item.createdAt : nowIso(),
              updatedAt: nowIso(),
            });
            added += 1;
          }

          if (!nextCategories.length) {
            for (const category of DEFAULT_CATEGORIES) nextCategories.push({ ...category });
          }

          const oldFileIds = state.tasks.flatMap((task) => (task.files || []).map((file) => file.id));
          state.categories = nextCategories;
          state.tasks = nextTasks;
          if (state.category !== 'all' && !nextCategories.some((category) => category.id === state.category)) {
            state.category = 'all';
          }

          await persist();

          const keepIds = new Set(nextTasks.flatMap((task) => (task.files || []).map((file) => file.id)));
          for (const fileId of new Set(oldFileIds)) {
            if (!keepIds.has(fileId)) await storage.deleteFile(fileId);
          }
          await storage.prune(keepIds);

          return { added, skipped, filesAdded };
        }

        /* ── 主题 / 提示 / 启动兜底 ───────────────────────── */

        const THEMES = [
          { value: 'auto', icon: '◐', label: '跟随系统' },
          { value: 'light', icon: '☀', label: '浅色' },
          { value: 'dark', icon: '☾', label: '深色' },
        ];

        function applyTheme(value) {
          document.documentElement.dataset.theme = value;
          try {
            localStorage.setItem(THEME_KEY, value);
          } catch {
            /* 无所谓 */
          }
          const current = THEMES.find((theme) => theme.value === value) || THEMES[0];
          $('#theme-btn').textContent = current.icon;
          $('#theme-btn').title = `主题：${current.label}（点击切换）`;
        }

        function cycleTheme() {
          const current = document.documentElement.dataset.theme || 'auto';
          const index = THEMES.findIndex((theme) => theme.value === current);
          applyTheme(THEMES[(index + 1) % THEMES.length].value);
        }

        let toastTimer = 0;

        function toast(message, kind = 'ok') {
          const box = $('#toast');
          box.textContent = message;
          box.className = `toast${kind === 'error' ? ' error' : ''}`;
          box.hidden = false;
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            box.hidden = true;
          }, 2600);
        }

        function showFatal(error) {
          const box = $('#boot-fallback');
          if (!box) return;
          const detail = error && error.stack ? String(error.stack) : String(error?.message || error || '未知错误');
          box.replaceChildren(
            el('strong', {}, '事务中心没能启动'),
            el('span', {}, '先按 Ctrl+F5 强制刷新。如果一直这样，把下面这段错误信息发给开发者。'),
            el('pre', { class: 'fatal-detail' }, detail),
          );
          const reload = el('button', { type: 'button', class: 'btn primary small' }, '刷新页面');
          reload.addEventListener('click', () => location.reload());
          box.append(reload);
        }

        window.addEventListener('error', (event) => {
          if ($('#app')?.hidden) showFatal(event.error || new Error(event.message));
        });
        window.addEventListener('unhandledrejection', (event) => {
          if ($('#app')?.hidden) showFatal(event.reason);
        });

        /* ── 事件绑定 ─────────────────────────────────────── */

        function bindEvents() {
          $('#theme-btn').addEventListener('click', cycleTheme);

          $$('.js-add').forEach((button) => {
            button.addEventListener('click', () => openTaskEditor(null, todayKey()));
          });
          $('#empty-add').addEventListener('click', () => openTaskEditor(null, todayKey()));

          $$('.js-export').forEach((button) => {
            button.addEventListener('click', exportBackup);
          });
          $$('.js-import').forEach((button) => {
            button.addEventListener('click', () => $('#import-file').click());
          });

          $('#import-file').addEventListener('change', (event) => {
            const file = event.target.files?.[0];
            if (file) handleImportFile(file);
            event.target.value = '';
          });

          $('#add-cat-btn').addEventListener('click', () => openCategoryEditor(null));

          let searchTimer = 0;
          $('#search').addEventListener('input', (event) => {
            clearTimeout(searchTimer);
            const value = event.target.value;
            searchTimer = setTimeout(() => {
              state.query = value;
              if (value.trim() && state.view === 'calendar') state.view = 'list';
              render();
            }, 120);
          });

          $('#prev-month').addEventListener('click', () => changeMonth(-1));
          $('#next-month').addEventListener('click', () => changeMonth(1));
          $('#today-btn').addEventListener('click', goToday);

          $('#view-switch').addEventListener('click', (event) => {
            const button = event.target.closest('[data-view]');
            if (button) setView(button.dataset.view);
          });

          $('#category-list').addEventListener('click', async (event) => {
            const edit = event.target.closest('[data-cat-edit]');
            if (edit) {
              const category = categoryOf(edit.dataset.catEdit);
              if (category) openCategoryEditor(category);
              return;
            }
            const remove = event.target.closest('[data-cat-delete]');
            if (remove) {
              const category = categoryOf(remove.dataset.catDelete);
              if (!category) return;
              const count = state.tasks.filter((task) => task.categoryId === category.id).length;
              const ok = await confirmDialog({
                title: '删除分类',
                message: count
                  ? `删除「${category.name}」后，其中 ${count} 条事务会变成「未分类」，事务本身不会删除。`
                  : `确定删除分类「${category.name}」吗？`,
              });
              if (!ok) return;
              state.categories = state.categories.filter((item) => item.id !== category.id);
              for (const task of state.tasks) {
                if (task.categoryId === category.id) task.categoryId = '';
              }
              if (state.category === category.id) state.category = 'all';
              await persist();
              render();
              toast('分类已删除');
              return;
            }
            const item = event.target.closest('[data-cat]');
            if (item) setCategory(item.dataset.cat);
          });

          $('#category-list').addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            const item = event.target.closest('[data-cat]');
            if (!item || event.target.closest('.cat-actions')) return;
            event.preventDefault();
            setCategory(item.dataset.cat);
          });

          $('#calendar').addEventListener('click', (event) => {
            const more = event.target.closest('.cal-more');
            if (more) {
              openDay(more.dataset.date);
              return;
            }
            const item = event.target.closest('.cal-item');
            if (item) {
              openTaskEditor(item.dataset.id);
              return;
            }
            const cell = event.target.closest('.cal-cell');
            if (!cell?.dataset.date) return;
            const isPhone = window.matchMedia('(max-width: 720px)').matches;
            if (isPhone && Number(cell.dataset.count) > 0) {
              openDay(cell.dataset.date);
              return;
            }
            openTaskEditor(null, cell.dataset.date);
          });

          $('#list').addEventListener('click', (event) => {
            if (event.target.closest('input, button, label')) return;
            const row = event.target.closest('[data-id]');
            if (row) openTaskEditor(row.dataset.id);
          });

          $('#list').addEventListener('change', (event) => {
            if (!event.target.classList.contains('task-check-input')) return;
            const row = event.target.closest('[data-id]');
            if (row) toggleDone(row.dataset.id, event.target.checked);
          });

          document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && currentModal) {
              closeModal();
              return;
            }
            const tag = (event.target.tagName || '').toLowerCase();
            const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || event.target.isContentEditable;
            if (typing || currentModal) return;
            if (event.ctrlKey || event.metaKey || event.altKey) return;

            if (event.key === '/') {
              event.preventDefault();
              $('#search').focus();
            } else if (event.key.toLowerCase() === 'n') {
              event.preventDefault();
              openTaskEditor(null, todayKey());
            }
          });
        }

        /* ── 启动 ─────────────────────────────────────────── */

        async function boot() {
          try {
            await storage.init();
            const saved = await storage.load();
            const normalized = normalizeState(saved || {});
            state.categories = normalized.categories;
            state.tasks = normalized.tasks;
            if (!saved && window.matchMedia('(max-width: 720px)').matches) {
              state.view = 'list';
            }

            applyTheme(localStorage.getItem(THEME_KEY) || 'auto');
            bindEvents();
            render();

            $('#app').hidden = false;
            $('#boot-fallback')?.remove();

            if (!saved) await persist();
          } catch (error) {
            console.error(error);
            showFatal(error);
          }
        }

        boot();
      })();
    </script>
  </body>
</html>
