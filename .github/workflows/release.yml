name: 构建便携包

# 打 tag（例如 v2.3.1）后自动打包并发布到 Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从 tag 同步版本号
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = '0.0.0' }
          Write-Host "版本: $version"

          $pkg = Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $pkg.version = $version
          ($pkg | ConvertTo-Json -Depth 10) | Set-Content package.json -Encoding UTF8

          $info = Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $info.version = $version
          # 直链代码更新包：应用内「下载」按钮直接用这个地址（lib/updates.js 读 version.json 的 url）
          $info.url = "${{ github.server_url }}/${{ github.repository }}/releases/latest/download/learning-hub-code.zip"
          ($info | ConvertTo-Json -Depth 10) | Set-Content version.json -Encoding UTF8

      # 应用内自更新读取的文件清单：只列运行时代码和前端资源，不包含 node/、data/
      - name: 生成更新清单
        shell: pwsh
        run: node tools/build-update-manifest.js

      - name: 打包
        shell: pwsh
        run: ./tools/build-package.ps1

      - name: 打包代码更新包
        shell: pwsh
        run: ./tools/build-update-package.ps1

      # GitHub 会过滤掉资源名里的中文，统一改成 ASCII，方便 version.json 直接用固定 URL
      - name: 统一发布文件名
        shell: pwsh
        run: |
          Copy-Item '学习中心-便携版.zip' 'learning-hub-portable.zip' -Force
          Copy-Item '学习中心-代码更新包.zip' 'learning-hub-code.zip' -Force

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            learning-hub-portable.zip
            learning-hub-code.zip
          generate_release_notes: true

      # 版本号回写到仓库，供应用内的「更新检查」使用
      - name: 提交版本号
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json version.json update-manifest.json
          git commit -m "chore: 版本号 ${{ github.ref_name }}" || echo "无需提交"
          # tag 触发时 GITHUB_REF_NAME 是 v2.9.0（没有 /），旧写法会推到 tag 名上必然失败
          git push origin "HEAD:main" || echo "跳过推送（main 已前进时会冲突，忽略即可）"
